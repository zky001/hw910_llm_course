# =============================================================================
# LLaMA-Factory · Qwen2.5-7B-Instruct · 8 卡 NPU · LoRA SFT 配置
# 启动: ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 FORCE_TORCHRUN=1 \
#         llamafactory-cli train qwen2_5_7b_lora_sft_npu.yaml
# 910A 用户: 把 bf16: true 改为 fp16: true, cutoff_len 酌情降到 1024
# =============================================================================

### model —— 建议填 4.2 节下载好的本地路径
model_name_or_path: ./models/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all          # 对所有线性层插 LoRA

### dataset —— identity(身份认知) + alpaca_zh_demo(中文指令), 都是 LLaMA-Factory 自带
dataset: identity,alpaca_zh_demo
template: qwen
cutoff_len: 2048
max_samples: 1000         # 演示用截断; 正式训练删掉此行
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen2.5-7b/lora/sft
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4     # 全局 batch = 2 * 8卡 * 4 = 64
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true                # 910B; 910A 改成 fp16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval (可选)
# val_size: 0.05
# per_device_eval_batch_size: 2
# eval_strategy: steps
# eval_steps: 200
